<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Défi Ponts - Technologie 5ème</title>
  <style>
    * {
      box-sizing: border-box; margin: 0; padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      background: #1e293b; color: #f8fafc;
      min-height: 100dvh; width: 100%;
      overflow-x: hidden; overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    }
    body {
      display: flex; flex-direction: column; align-items: center;
    }
    header {
      width: 100%; max-width: 1120px; padding: 8px 12px;
      display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center;
      background: #0f172a; border-bottom: 1px solid #334155;
    }
    .group { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    button {
      padding: 6px 12px; border: none; border-radius: 6px; cursor: pointer;
      font-weight: 600; font-size: 13px; background: #334155; color: #f8fafc;
      transition: background 0.15s, opacity 0.15s;
      -webkit-appearance: none; appearance: none;
    }
    button:hover:not(:disabled) { background: #475569; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    button.active { background: #3b82f6; color: #fff; }
    button.play { background: #16a34a; }
    button.play:hover:not(:disabled) { background: #15803d; }
    button.stop { background: #dc2626; }
    button.danger { background: #991b1b; }
    .stats {
      font-size: 13px; font-weight: 700; padding: 5px 10px;
      background: #1e293b; border-radius: 6px; border: 1px solid #475569;
    }
    .lock-badge {
      display: none; font-size: 12px; font-weight: 700; padding: 4px 8px;
      background: #7c2d12; color: #fed7aa; border: 1px solid #ea580c; border-radius: 6px;
    }
    .lock-badge.visible { display: inline-block; }

    #main-area {
      width: 100%; max-width: 1120px; flex: 1;
      display: flex; gap: 12px; padding: 10px; align-items: flex-start;
    }
    #canvas-wrap {
      position: relative; flex: 1; min-width: 0; width: 100%;
    }
    .canvas-box {
      position: relative; width: 100%; aspect-ratio: 16 / 9;
      background: #e0f2fe; border-radius: 8px; overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }
    canvas {
      display: block; width: 100%; height: 100%;
      touch-action: none;
    }
    #banner {
      position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
      padding: 8px 16px; border-radius: 8px; font-weight: 800; font-size: 15px;
      display: none; box-shadow: 0 4px 15px rgba(0,0,0,0.3); text-align: center;
      pointer-events: none; max-width: 90%; z-index: 5;
    }
    #banner.win { display: block; background: #16a34a; color: #fff; }
    #banner.fail { display: block; background: #dc2626; color: #fff; }
    #banner.score { display: block; background: #0284c7; color: #fff; }

    #report-panel {
      width: 240px; flex-shrink: 0; background: #0f172a;
      border: 1px solid #334155; border-radius: 8px; padding: 12px;
      display: flex; flex-direction: column; gap: 10px;
    }
    #report-panel h2 {
      font-size: 14px; border-bottom: 1px solid #334155; padding-bottom: 6px;
      color: #e2e8f0; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .report-card {
      background: #1e293b; border: 1px solid #334155; border-radius: 6px;
      padding: 10px; display: flex; flex-direction: column; gap: 5px;
    }
    .report-card h3 { font-size: 13px; color: #94a3b8; }
    .report-val { font-size: 15px; font-weight: 700; color: #cbd5e1; }
    .report-val.ok { color: #4ade80; }
    .report-val.ko { color: #f87171; }
    .report-val.num { color: #38bdf8; }
    .report-sub { font-size: 12px; color: #94a3b8; }
    .reset-report {
      margin-top: 4px; font-size: 12px; background: #334155; color: #f8fafc;
    }

    footer {
      font-size: 12px; color: #94a3b8; padding: 4px 12px 12px; text-align: center;
    }

    /* Téléphone portrait */
    @media (max-width: 760px) {
      #main-area { flex-direction: column; padding: 8px; }
      #report-panel { width: 100%; flex-direction: row; flex-wrap: wrap; }
      #report-panel h2 { width: 100%; }
      .report-card { flex: 1; min-width: 140px; }
      .reset-report { width: 100%; }
    }

    /* Téléphone paysage : interface compacte + défilement libre */
    @media (max-height: 500px) and (orientation: landscape) {
      header { padding: 5px 8px; gap: 5px; }
      button { padding: 4px 8px; font-size: 12px; }
      .stats { font-size: 12px; padding: 4px 8px; }
      #main-area { flex-direction: row; padding: 6px 8px; gap: 8px; }
      #report-panel { width: 195px; padding: 8px; gap: 6px; flex-direction: column; }
      .report-card { padding: 7px; gap: 3px; }
      .report-val { font-size: 13px; }
      footer { font-size: 11px; padding: 2px 8px 8px; }
    }
  </style>
</head>
<body>

<header>
  <div class="group">
    <button id="btn-lvl-0" class="active" onclick="loadLevel(0)">Niveau 1 : Traversée</button>
    <button id="btn-lvl-1" onclick="loadLevel(1)">Niveau 2 : Test de Charge</button>
  </div>

  <div class="group">
    <button id="tool-beam" class="active" onclick="setTool('beam')">🔨 Construire</button>
    <button id="tool-erase" onclick="setTool('erase')">❌ Gomme</button>
    <span id="lock-badge" class="lock-badge">🔒 Verrouillé</span>
  </div>

  <div class="group">
    <span id="cost-display" class="stats">Coût : 0 €</span>
    <button id="btn-sim" class="play" onclick="toggleSim()">▶ Tester</button>
    <button id="btn-clear" class="danger" onclick="clearBridge()">Vider</button>
  </div>
</header>

<div id="main-area">
  <div id="canvas-wrap">
    <div class="canvas-box">
      <canvas id="game" width="800" height="450"></canvas>
      <div id="banner"></div>
    </div>
  </div>

  <aside id="report-panel">
    <h2>Compte rendu</h2>

    <div class="report-card">
      <h3>Niveau 1 : Traversée</h3>
      <div id="rep-lvl0-status" class="report-val">Non testé</div>
      <div id="rep-lvl0-cost" class="report-sub">Coût : —</div>
    </div>

    <div class="report-card">
      <h3>Niveau 2 : Test de Charge</h3>
      <div id="rep-lvl1-status" class="report-val">Non testé</div>
      <div id="rep-lvl1-cost" class="report-sub">Coût : —</div>
    </div>

    <button class="reset-report" onclick="resetSession()">🔄 Tout réinitialiser</button>
  </aside>
</div>

<footer>
  Pars d'un point d'appui ou d'un segment existant • Longueur max : 5 cases • Chaque niveau verrouille son pont après test
</footer>

<script>
// ============================================================================
// CONFIGURATION MÉCANIQUE & NIVEAUX
// ============================================================================
const GRID = 40;
const MAX_BEAM_LEN = 205; // 5 cases de longueur

const PHYSICS = {
  substeps: 8,
  solverIters: 35,
  gravity: 0.16,
  damping: 0.985,
  compliance: 0.015,
  massPerPx: 0.012
};

const BEAM_SPEC = {
  costPerPx: 1.2,
  maxTension: 22,
  maxCompression: 20,
  width: 6,
  color: '#334155'
};

const LEVELS = [
  {
    name: "Niveau 1 : Traversée",
    mode: "truck",
    truckWheelForce: 2.8,
    truckSpeed: 1.45,
    leftBankX: 160,
    rightBankX: 640,
    leftBankY: 240,
    rightBankY: 240,
    anchors: [
      { x: 160, y: 240 },
      { x: 160, y: 320 },
      { x: 640, y: 240 },
      { x: 640, y: 320 }
    ]
  },
  {
    name: "Niveau 2 : Test de Charge",
    mode: "weight",
    weightRate: 0.08,
    weightForceScale: 0.55,
    leftBankX: 160,
    rightBankX: 640,
    leftBankY: 240,
    rightBankY: 240,
    anchors: [
      { x: 160, y: 240 },
      { x: 160, y: 320 },
      { x: 640, y: 240 },
      { x: 640, y: 320 }
    ]
  }
];

// ============================================================================
// ÉTAT DU JEU, MÉMOIRE PAR NIVEAU & COMPTE RENDU
// ============================================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const banner = document.getElementById('banner');
const costDisplay = document.getElementById('cost-display');
const btnSim = document.getElementById('btn-sim');
const btnClear = document.getElementById('btn-clear');
const btnBeam = document.getElementById('tool-beam');
const btnErase = document.getElementById('tool-erase');
const lockBadge = document.getElementById('lock-badge');

let currentLevelIdx = 0;
let level = LEVELS[0];
let tool = 'beam';
let isSimulating = false;
let isBridgeLocked = false;
let simStatus = 'idle';
let restoreTimer = null;

let levelStates = [];

function createEmptyLevelState(lvl) {
  return {
    nodes: lvl.anchors.map((a, i) => ({ id: i, x: a.x, y: a.y, pinned: true })),
    beams: [],
    locked: false
  };
}

function saveCurrentLevelState() {
  levelStates[currentLevelIdx] = {
    nodes: designNodes,
    beams: designBeams,
    locked: isBridgeLocked
  };
}

let designNodes = [];
let designBeams = [];

let simNodes = [];
let simBeams = [];
let truck = null;
let loadBlock = null;

let dragStart = null;
let activePointerId = null;
let pointerPos = { x: 0, y: 0 };
let hoveredAnchor = null;

const reportData = {
  lvl0: null,
  lvl1: null
};

function updateLockUI() {
  btnBeam.disabled = isBridgeLocked;
  btnErase.disabled = isBridgeLocked;
  btnClear.disabled = isBridgeLocked;
  lockBadge.classList.toggle('visible', isBridgeLocked);
  if (isBridgeLocked) {
    dragStart = null;
    activePointerId = null;
    hoveredAnchor = null;
  }
}

function updateReportUI() {
  const s0 = document.getElementById('rep-lvl0-status');
  const c0 = document.getElementById('rep-lvl0-cost');
  if (!reportData.lvl0) {
    s0.textContent = "Non testé";
    s0.className = "report-val";
    c0.textContent = "Coût : —";
  } else {
    s0.textContent = reportData.lvl0.passed ? "✅ Voiture passée" : "❌ Pont effondré";
    s0.className = "report-val " + (reportData.lvl0.passed ? "ok" : "ko");
    c0.textContent = `Coût : ${reportData.lvl0.cost} €`;
  }

  const s1 = document.getElementById('rep-lvl1-status');
  const c1 = document.getElementById('rep-lvl1-cost');
  if (!reportData.lvl1) {
    s1.textContent = "Non testé";
    s1.className = "report-val";
    c1.textContent = "Coût : —";
  } else {
    s1.textContent = `⚖️ ${reportData.lvl1.tonnes.toFixed(1)} tonnes`;
    s1.className = "report-val num";
    c1.textContent = `Coût : ${reportData.lvl1.cost} €`;
  }
}

function loadLevel(idx) {
  if (idx === currentLevelIdx) return;
  stopSim(true);
  saveCurrentLevelState();

  currentLevelIdx = idx;
  level = LEVELS[idx];
  designNodes = levelStates[idx].nodes;
  designBeams = levelStates[idx].beams;
  isBridgeLocked = levelStates[idx].locked;

  document.getElementById('btn-lvl-0').classList.toggle('active', idx === 0);
  document.getElementById('btn-lvl-1').classList.toggle('active', idx === 1);
  updateLockUI();
  updateCostUI();
}

function setTool(t) {
  if (isSimulating || isBridgeLocked) return;
  tool = t;
  ['beam', 'erase'].forEach(name => {
    document.getElementById('tool-' + name).classList.toggle('active', name === t);
  });
}

function clearBridge() {
  if (isBridgeLocked) return;
  stopSim(true);
  const fresh = createEmptyLevelState(level);
  designNodes = fresh.nodes;
  designBeams = fresh.beams;
  saveCurrentLevelState();
  updateCostUI();
}

function resetSession() {
  stopSim(true);
  levelStates = LEVELS.map(lvl => createEmptyLevelState(lvl));
  designNodes = levelStates[currentLevelIdx].nodes;
  designBeams = levelStates[currentLevelIdx].beams;
  isBridgeLocked = false;
  reportData.lvl0 = null;
  reportData.lvl1 = null;
  updateLockUI();
  updateReportUI();
  updateCostUI();
}

function getCost() {
  return Math.round(designBeams.reduce((sum, b) => {
    const a = designNodes[b.a], c = designNodes[b.b];
    return sum + Math.hypot(c.x - a.x, c.y - a.y) * BEAM_SPEC.costPerPx;
  }, 0));
}

function updateCostUI() {
  costDisplay.textContent = `Coût : ${getCost()} €`;
}

// ============================================================================
// GÉOMÉTRIE & TOPOLOGIE DES LIAISONS (NŒUDS, JONCTIONS EN T ET EN X)
// ============================================================================
function getCanvasCoords(e) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - rect.left) * (canvas.width / rect.width),
    y: (e.clientY - rect.top) * (canvas.height / rect.height)
  };
}

function projectPointOnSegment(p, v, w) {
  const l2 = (v.x - w.x) ** 2 + (v.y - w.y) ** 2;
  if (l2 < 1e-6) return { x: v.x, y: v.y, t: 0, dist: Math.hypot(p.x - v.x, p.y - v.y) };
  let t = ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2;
  t = Math.max(0, Math.min(1, t));
  const x = v.x + t * (w.x - v.x);
  const y = v.y + t * (w.y - v.y);
  return { x, y, t, dist: Math.hypot(p.x - x, p.y - y) };
}

function findExistingNodeNear(pos, maxDist = 22) {
  let best = null;
  let bestDist = maxDist;
  for (let n of designNodes) {
    const d = Math.hypot(n.x - pos.x, n.y - pos.y);
    if (d < bestDist) {
      bestDist = d;
      best = n;
    }
  }
  return best;
}

function findPointOnExistingBeam(pos, maxDist = 18) {
  let best = null;
  let bestDist = maxDist;
  for (let b of designBeams) {
    const p1 = designNodes[b.a], p2 = designNodes[b.b];
    const proj = projectPointOnSegment(pos, p1, p2);
    if (proj.dist < bestDist) {
      bestDist = proj.dist;
      best = { x: proj.x, y: proj.y };
    }
  }
  return best;
}

function findValidStartPoint(raw) {
  const node = findExistingNodeNear(raw, 26);
  if (node) return { x: node.x, y: node.y };
  return findPointOnExistingBeam(raw, 18);
}

function snapPointer(raw) {
  const node = findExistingNodeNear(raw, 20);
  if (node) return { x: node.x, y: node.y };

  const gridPt = {
    x: Math.round(raw.x / GRID) * GRID,
    y: Math.round(raw.y / GRID) * GRID
  };
  const onBeamFromGrid = findPointOnExistingBeam(gridPt, 6);
  if (onBeamFromGrid && Math.hypot(raw.x - gridPt.x, raw.y - gridPt.y) < 18) {
    return { x: onBeamFromGrid.x, y: onBeamFromGrid.y };
  }

  const onBeam = findPointOnExistingBeam(raw, 16);
  if (onBeam) return onBeam;

  return gridPt;
}

function findOrCreateNode(x, y) {
  let idx = designNodes.findIndex(n => Math.hypot(n.x - x, n.y - y) < 6);
  if (idx !== -1) return idx;
  designNodes.push({ id: designNodes.length, x, y, pinned: false });
  return designNodes.length - 1;
}

function segmentIntersection(p1, p2, p3, p4) {
  const denom = (p1.x - p2.x) * (p3.y - p4.y) - (p1.y - p2.y) * (p3.x - p4.x);
  if (Math.abs(denom) < 1e-6) return null;
  const t = ((p1.x - p3.x) * (p3.y - p4.y) - (p1.y - p3.y) * (p3.x - p4.x)) / denom;
  const u = -((p1.x - p2.x) * (p1.y - p3.y) - (p1.y - p2.y) * (p1.x - p3.x)) / denom;
  if (t > 0.02 && t < 0.98 && u > 0.02 && u < 0.98) {
    return { t, u, x: p1.x + t * (p2.x - p1.x), y: p1.y + t * (p2.y - p1.y) };
  }
  return null;
}

function addBeamWithTopology(pStart, pEnd) {
  const startIdx = findOrCreateNode(pStart.x, pStart.y);
  const endIdx = findOrCreateNode(pEnd.x, pEnd.y);
  if (startIdx === endIdx) return;

  const pA = designNodes[startIdx];
  const pB = designNodes[endIdx];

  const newSegSplits = [
    { t: 0, idx: startIdx },
    { t: 1, idx: endIdx }
  ];
  const existingSplits = new Map();

  const registerExistingSplit = (beamIdx, u, nodeIdx) => {
    if (!existingSplits.has(beamIdx)) existingSplits.set(beamIdx, []);
    existingSplits.get(beamIdx).push({ u, idx: nodeIdx });
  };

  for (let i = 0; i < designBeams.length; i++) {
    const b = designBeams[i];
    const p3 = designNodes[b.a];
    const p4 = designNodes[b.b];

    if (startIdx !== b.a && startIdx !== b.b) {
      const proj = projectPointOnSegment(pA, p3, p4);
      if (proj.dist < 6 && proj.t > 0.02 && proj.t < 0.98) {
        registerExistingSplit(i, proj.t, startIdx);
      }
    }

    if (endIdx !== b.a && endIdx !== b.b) {
      const proj = projectPointOnSegment(pB, p3, p4);
      if (proj.dist < 6 && proj.t > 0.02 && proj.t < 0.98) {
        registerExistingSplit(i, proj.t, endIdx);
      }
    }

    if (startIdx !== b.a && startIdx !== b.b && endIdx !== b.a && endIdx !== b.b) {
      const inter = segmentIntersection(pA, pB, p3, p4);
      if (inter) {
        const midIdx = findOrCreateNode(inter.x, inter.y);
        registerExistingSplit(i, inter.u, midIdx);
        newSegSplits.push({ t: inter.t, idx: midIdx });
      }
    }
  }

  for (let idx = 0; idx < designNodes.length; idx++) {
    if (idx === startIdx || idx === endIdx) continue;
    const proj = projectPointOnSegment(designNodes[idx], pA, pB);
    if (proj.dist < 6 && proj.t > 0.02 && proj.t < 0.98) {
      newSegSplits.push({ t: proj.t, idx });
    }
  }

  const rebuilt = [];
  const pushUnique = (a, b) => {
    if (a === b) return;
    const exists = rebuilt.some(beam => (beam.a === a && beam.b === b) || (beam.a === b && beam.b === a));
    if (!exists) rebuilt.push({ a, b });
  };

  for (let i = 0; i < designBeams.length; i++) {
    const b = designBeams[i];
    if (!existingSplits.has(i)) {
      pushUnique(b.a, b.b);
    } else {
      const splits = existingSplits.get(i).sort((x, y) => x.u - y.u);
      const chain = [b.a, ...splits.map(s => s.idx), b.b];
      for (let k = 0; k < chain.length - 1; k++) {
        pushUnique(chain[k], chain[k + 1]);
      }
    }
  }

  newSegSplits.sort((x, y) => x.t - y.t);
  for (let k = 0; k < newSegSplits.length - 1; k++) {
    pushUnique(newSegSplits[k].idx, newSegSplits[k + 1].idx);
  }

  designBeams = rebuilt;
  saveCurrentLevelState();
}

function cleanupOrphanNodes() {
  const used = new Set();
  designBeams.forEach(b => { used.add(b.a); used.add(b.b); });
  const newNodes = [];
  const map = {};
  designNodes.forEach((n, i) => {
    if (n.pinned || used.has(i)) {
      map[i] = newNodes.length;
      newNodes.push({ ...n, id: newNodes.length });
    }
  });
  designNodes = newNodes;
  designBeams.forEach(b => { b.a = map[b.a]; b.b = map[b.b]; });
  saveCurrentLevelState();
}

// ============================================================================
// GESTION TACTILE / SOURIS COMPATIBLE SAFARI iOS
// ============================================================================
// Empêche Safari de faire défiler ou rebondir la page quand on touche le canvas
canvas.addEventListener('touchstart', e => { e.preventDefault(); }, { passive: false });
canvas.addEventListener('touchmove', e => { e.preventDefault(); }, { passive: false });

canvas.addEventListener('pointerdown', e => {
  if (!e.isPrimary || isSimulating || isBridgeLocked) return;
  e.preventDefault();
  banner.className = '';
  const raw = getCanvasCoords(e);

  if (tool === 'erase') {
    let bestIdx = -1, bestDist = 22;
    designBeams.forEach((b, i) => {
      const proj = projectPointOnSegment(raw, designNodes[b.a], designNodes[b.b]);
      if (proj.dist < bestDist) { bestDist = proj.dist; bestIdx = i; }
    });
    if (bestIdx !== -1) {
      designBeams.splice(bestIdx, 1);
      cleanupOrphanNodes();
      updateCostUI();
    }
    return;
  }

  const startPt = findValidStartPoint(raw);
  if (!startPt) return;

  activePointerId = e.pointerId;
  try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
  dragStart = startPt;
  pointerPos = { x: startPt.x, y: startPt.y };
});

canvas.addEventListener('pointermove', e => {
  if (!e.isPrimary || isSimulating || isBridgeLocked) return;
  const raw = getCanvasCoords(e);
  if (dragStart && e.pointerId === activePointerId) {
    e.preventDefault();
    pointerPos = snapPointer(raw);
  } else if (!dragStart) {
    hoveredAnchor = findValidStartPoint(raw);
    pointerPos = snapPointer(raw);
  }
});

function finishDrag(e) {
  if (activePointerId !== null && e.pointerId !== activePointerId) return;
  if (activePointerId !== null) {
    try { canvas.releasePointerCapture(activePointerId); } catch (_) {}
    activePointerId = null;
  }
  if (isSimulating || isBridgeLocked || !dragStart || tool === 'erase') {
    dragStart = null;
    return;
  }
  const len = Math.hypot(pointerPos.x - dragStart.x, pointerPos.y - dragStart.y);
  if (len >= 15 && len <= MAX_BEAM_LEN) {
    addBeamWithTopology(dragStart, pointerPos);
    updateCostUI();
  }
  dragStart = null;
}

canvas.addEventListener('pointerup', finishDrag);
canvas.addEventListener('pointercancel', () => {
  dragStart = null;
  activePointerId = null;
});

// ============================================================================
// SIMULATION PHYSIQUE XPBD (MÉCANIQUE DES TREILLIS)
// ============================================================================
function toggleSim() {
  if (isSimulating) {
    stopSim(true);
  } else {
    if (designBeams.length === 0) {
      showBanner("Construis d'abord un pont avant de tester !", "fail");
      return;
    }
    startSim();
  }
}

function startSim() {
  if (restoreTimer) { clearTimeout(restoreTimer); restoreTimer = null; }
  isSimulating = true;
  isBridgeLocked = true;
  saveCurrentLevelState();
  updateLockUI();

  simStatus = 'running';
  banner.className = '';
  btnSim.textContent = "⏹ Arrêter";
  btnSim.className = "stop";

  simNodes = designNodes.map(n => ({
    x: n.x, y: n.y, prevX: n.x, prevY: n.y,
    vx: 0, vy: 0, fx: 0, fy: 0,
    mass: 0.25, invMass: 0, pinned: n.pinned
  }));

  simBeams = designBeams.map(b => {
    const n1 = simNodes[b.a], n2 = simNodes[b.b];
    const len = Math.hypot(n2.x - n1.x, n2.y - n1.y);
    const beamMass = len * PHYSICS.massPerPx;
    n1.mass += beamMass * 0.5;
    n2.mass += beamMass * 0.5;

    const bucklingFactor = 1 - 0.25 * Math.min(1, len / MAX_BEAM_LEN);
    return {
      a: b.a, b: b.b,
      restLen: len,
      maxTension: BEAM_SPEC.maxTension,
      maxCompression: BEAM_SPEC.maxCompression * bucklingFactor,
      lambda: 0,
      stressRatio: 0,
      broken: false
    };
  });

  for (let n of simNodes) {
    n.invMass = n.pinned ? 0 : (1 / n.mass);
  }

  if (level.mode === 'truck') {
    loadBlock = null;
    truck = {
      w1: { x: 40, y: level.leftBankY - 11, vy: 0 },
      w2: { x: 85, y: level.leftBankY - 11, vy: 0 },
      wheelbase: 45,
      radius: 11
    };
  } else {
    truck = null;
    loadBlock = {
      x: 400,
      y: level.leftBankY - 26,
      width: 70,
      height: 44,
      vy: 0,
      tonnes: 0,
      maxTonnes: 0
    };
  }
}

function stopSim(clearBanner = false) {
  if (restoreTimer) { clearTimeout(restoreTimer); restoreTimer = null; }
  isSimulating = false;
  simStatus = 'idle';
  if (clearBanner) banner.className = '';
  btnSim.textContent = "▶ Tester";
  btnSim.className = "play";
  truck = null;
  loadBlock = null;
}

function scheduleBridgeRestore() {
  if (restoreTimer) clearTimeout(restoreTimer);
  restoreTimer = setTimeout(() => {
    stopSim(false);
  }, 1500);
}

function showBanner(text, type) {
  banner.textContent = text;
  banner.className = type;
}

function applyLoadToBeam(px, py, radius, downwardForce) {
  let bestY = Infinity;
  let hitBeam = null;
  let hitT = 0;

  for (let b of simBeams) {
    if (b.broken) continue;
    const n1 = simNodes[b.a], n2 = simNodes[b.b];
    const minX = Math.min(n1.x, n2.x), maxX = Math.max(n1.x, n2.x);
    if (px >= minX - 2 && px <= maxX + 2) {
      const dx = n2.x - n1.x;
      if (Math.abs(dx) < 1) continue;
      const t = Math.max(0, Math.min(1, (px - n1.x) / dx));
      const beamY = n1.y + t * (n2.y - n1.y);
      if (py + radius >= beamY - 8 && py + radius <= beamY + 30 && beamY < bestY) {
        bestY = beamY;
        hitBeam = b;
        hitT = t;
      }
    }
  }

  if (hitBeam) {
    const n1 = simNodes[hitBeam.a], n2 = simNodes[hitBeam.b];
    n1.fy += downwardForce * (1 - hitT);
    n2.fy += downwardForce * hitT;
    return bestY - radius;
  }
  return null;
}

function stepPhysics() {
  const substeps = PHYSICS.substeps;
  const subDt = 1 / substeps;
  const subDt2 = subDt * subDt;
  const alphaTilde = PHYSICS.compliance / subDt2;

  for (let s = 0; s < substeps; s++) {
    for (let n of simNodes) {
      n.fx = 0;
      n.fy = n.mass * PHYSICS.gravity;
    }

    if (truck && simStatus === 'running') {
      [truck.w1, truck.w2].forEach(w => {
        w.x += level.truckSpeed * subDt;
        w.vy += 0.35 * subDt;
        w.y += w.vy * subDt;

        if (w.x <= level.leftBankX && w.y + truck.radius >= level.leftBankY) {
          w.y = level.leftBankY - truck.radius;
          w.vy = 0;
        } else if (w.x >= level.rightBankX && w.y + truck.radius >= level.rightBankY) {
          w.y = level.rightBankY - truck.radius;
          w.vy = 0;
        } else {
          const newY = applyLoadToBeam(w.x, w.y, truck.radius, level.truckWheelForce);
          if (newY !== null) {
            w.y = newY;
            w.vy = 0;
          }
        }
      });

      const dx = truck.w2.x - truck.w1.x;
      const dy = truck.w2.y - truck.w1.y;
      const dist = Math.hypot(dx, dy) || 1;
      const diff = (truck.wheelbase - dist) / dist * 0.5;
      truck.w1.x -= dx * diff; truck.w1.y -= dy * diff;
      truck.w2.x += dx * diff; truck.w2.y += dy * diff;
    }

    if (loadBlock && simStatus === 'running') {
      loadBlock.vy += 0.30 * subDt;
      loadBlock.y += loadBlock.vy * subDt;

      const forcePerFoot = (0.4 + loadBlock.tonnes * level.weightForceScale) * 0.5;
      const yLeft = applyLoadToBeam(loadBlock.x - 24, loadBlock.y, loadBlock.height / 2, forcePerFoot);
      const yRight = applyLoadToBeam(loadBlock.x + 24, loadBlock.y, loadBlock.height / 2, forcePerFoot);

      if (yLeft !== null || yRight !== null) {
        loadBlock.y = (yLeft !== null && yRight !== null) ? Math.min(yLeft, yRight) : (yLeft ?? yRight);
        loadBlock.vy = 0;
        loadBlock.tonnes += level.weightRate * subDt;
        loadBlock.maxTonnes = loadBlock.tonnes;
      }
    }

    for (let n of simNodes) {
      if (n.pinned) continue;
      n.vx += (n.fx * n.invMass) * subDt;
      n.vy += (n.fy * n.invMass) * subDt;
      n.prevX = n.x;
      n.prevY = n.y;
      n.x += n.vx * subDt;
      n.y += n.vy * subDt;
    }

    for (let b of simBeams) b.lambda = 0;

    for (let iter = 0; iter < PHYSICS.solverIters; iter++) {
      for (let b of simBeams) {
        if (b.broken) continue;
        const n1 = simNodes[b.a], n2 = simNodes[b.b];
        const wSum = n1.invMass + n2.invMass;
        if (wSum === 0) continue;

        const dx = n2.x - n1.x;
        const dy = n2.y - n1.y;
        const dist = Math.hypot(dx, dy) || 0.0001;
        const C = dist - b.restLen;

        const dLambda = (-C - alphaTilde * b.lambda) / (wSum + alphaTilde);
        b.lambda += dLambda;

        const nx = dx / dist;
        const ny = dy / dist;
        if (!n1.pinned) {
          n1.x -= n1.invMass * dLambda * nx;
          n1.y -= n1.invMass * dLambda * ny;
        }
        if (!n2.pinned) {
          n2.x += n2.invMass * dLambda * nx;
          n2.y += n2.invMass * dLambda * ny;
        }
      }
    }

    const dampSub = Math.pow(PHYSICS.damping, subDt);
    for (let n of simNodes) {
      if (n.pinned) continue;
      n.vx = ((n.x - n.prevX) / subDt) * dampSub;
      n.vy = ((n.y - n.prevY) / subDt) * dampSub;
    }

    for (let b of simBeams) {
      if (b.broken) continue;
      const axialForce = -b.lambda / subDt2;
      const limit = axialForce >= 0 ? b.maxTension : b.maxCompression;
      const instantRatio = Math.abs(axialForce) / limit;

      b.stressRatio = b.stressRatio * 0.7 + instantRatio * 0.3;
      if (b.stressRatio > 1.0) {
        b.broken = true;
      }
    }
  }

  if (truck && simStatus === 'running') {
    if (truck.w1.y > canvas.height + 20 || truck.w2.y > canvas.height + 20) {
      simStatus = 'fail';
      reportData.lvl0 = { passed: false, cost: getCost() };
      updateReportUI();
      showBanner("Le pont s'est effondré !", "fail");
      scheduleBridgeRestore();
    } else if (truck.w1.x > level.rightBankX + 40) {
      simStatus = 'win';
      reportData.lvl0 = { passed: true, cost: getCost() };
      updateReportUI();
      showBanner("Bravo ! La voiture a traversé !", "win");
      scheduleBridgeRestore();
    }
  }

  if (loadBlock && simStatus === 'running') {
    if (loadBlock.y > canvas.height - 35) {
      simStatus = 'score';
      reportData.lvl1 = { tonnes: loadBlock.maxTonnes, cost: getCost() };
      updateReportUI();
      showBanner(`Rupture à ${loadBlock.maxTonnes.toFixed(1)} tonnes`, "score");
      scheduleBridgeRestore();
    }
  }
}

// ============================================================================
// RENDU GRAPHIQUE
// ============================================================================
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Grille
  ctx.strokeStyle = 'rgba(148, 163, 184, 0.25)';
  ctx.lineWidth = 1;
  for (let x = 0; x <= canvas.width; x += GRID) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
  }
  for (let y = 0; y <= canvas.height; y += GRID) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
  }

  // Eau
  ctx.fillStyle = '#38bdf8';
  ctx.fillRect(0, canvas.height - 35, canvas.width, 35);

  // Falaises
  ctx.fillStyle = '#64748b';
  ctx.fillRect(0, level.leftBankY, level.leftBankX, canvas.height - level.leftBankY);
  ctx.fillRect(level.rightBankX, level.rightBankY, canvas.width - level.rightBankX, canvas.height - level.rightBankY);
  ctx.fillStyle = '#22c55e';
  ctx.fillRect(0, level.leftBankY, level.leftBankX, 8);
  ctx.fillRect(level.rightBankX, level.rightBankY, canvas.width - level.rightBankX, 8);

  // Zone de pose du poids (Niveau 2 hors simulation)
  if (!isSimulating && level.mode === 'weight') {
    ctx.save();
    ctx.strokeStyle = '#f59e0b';
    ctx.fillStyle = 'rgba(245, 158, 11, 0.15)';
    ctx.lineWidth = 2;
    ctx.setLineDash([5, 4]);
    ctx.fillRect(365, level.leftBankY - 48, 70, 44);
    ctx.strokeRect(365, level.leftBankY - 48, 70, 44);
    ctx.fillStyle = '#b45309';
    ctx.font = 'bold 12px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText('POIDS ICI', 400, level.leftBankY - 22);
    ctx.restore();
  }

  // Poutres
  const nodes = isSimulating ? simNodes : designNodes;
  const beams = isSimulating ? simBeams : designBeams;

  for (let b of beams) {
    if (b.broken) continue;
    const n1 = nodes[b.a], n2 = nodes[b.b];
    ctx.beginPath();
    ctx.moveTo(n1.x, n1.y);
    ctx.lineTo(n2.x, n2.y);
    ctx.lineWidth = BEAM_SPEC.width;

    if (isSimulating) {
      const ratio = Math.min(1, b.stressRatio);
      const r = Math.round(255 * Math.min(1, ratio * 1.4));
      const g = Math.round(200 * Math.max(0, 1 - ratio * 1.1));
      ctx.strokeStyle = `rgb(${r}, ${g}, 40)`;
    } else {
      ctx.strokeStyle = BEAM_SPEC.color;
    }
    ctx.stroke();
  }

  // Prévisualisation pendant le tracé
  if (!isSimulating && !isBridgeLocked && dragStart && tool === 'beam') {
    const len = Math.hypot(pointerPos.x - dragStart.x, pointerPos.y - dragStart.y);
    ctx.beginPath();
    ctx.moveTo(dragStart.x, dragStart.y);
    ctx.lineTo(pointerPos.x, pointerPos.y);
    ctx.lineWidth = 5;
    ctx.setLineDash([6, 4]);
    ctx.strokeStyle = (len <= MAX_BEAM_LEN && len >= 15) ? '#2563eb' : '#ef4444';
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // Nœuds
  for (let n of nodes) {
    ctx.beginPath();
    ctx.arc(n.x, n.y, n.pinned ? 7 : 5, 0, Math.PI * 2);
    ctx.fillStyle = n.pinned ? '#dc2626' : '#0f172a';
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  // Indicateur visuel du point d'accroche survolé
  if (!isSimulating && !isBridgeLocked && tool === 'beam' && hoveredAnchor && !dragStart) {
    ctx.beginPath();
    ctx.arc(hoveredAnchor.x, hoveredAnchor.y, 7, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(37, 99, 235, 0.85)';
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  // Camion (Niveau 1)
  if (truck) {
    const angle = Math.atan2(truck.w2.y - truck.w1.y, truck.w2.x - truck.w1.x);
    ctx.save();
    ctx.translate(truck.w1.x, truck.w1.y);
    ctx.rotate(angle);
    ctx.fillStyle = '#f59e0b';
    ctx.fillRect(-10, -28, 65, 22);
    ctx.fillStyle = '#0ea5e9';
    ctx.fillRect(38, -24, 14, 10);
    ctx.restore();

    [truck.w1, truck.w2].forEach(w => {
      ctx.beginPath();
      ctx.arc(w.x, w.y, truck.radius, 0, Math.PI * 2);
      ctx.fillStyle = '#1e293b';
      ctx.fill();
      ctx.strokeStyle = '#cbd5e1';
      ctx.lineWidth = 2;
      ctx.stroke();
    });
  }

  // Bloc de poids progressif (Niveau 2)
  if (loadBlock) {
    ctx.save();
    ctx.fillStyle = '#334155';
    ctx.strokeStyle = '#f59e0b';
    ctx.lineWidth = 3;
    ctx.fillRect(loadBlock.x - loadBlock.width / 2, loadBlock.y - loadBlock.height / 2, loadBlock.width, loadBlock.height);
    ctx.strokeRect(loadBlock.x - loadBlock.width / 2, loadBlock.y - loadBlock.height / 2, loadBlock.width, loadBlock.height);

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 15px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText(`${loadBlock.maxTonnes.toFixed(1)} t`, loadBlock.x, loadBlock.y + 5);
    ctx.restore();
  }
}

function loop() {
  if (isSimulating) stepPhysics();
  draw();
  requestAnimationFrame(loop);
}

// Initialisation
resetSession();
loop();
</script>
</body>
